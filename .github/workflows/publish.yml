name: Build and Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Cache OCCT build
        id: cache-occt
        uses: actions/cache@v4
        with:
          path: build/occt-install
          key: occt-${{ hashFiles('.gitmodules', 'extern/occt') }}-emsdk-3.1.51

      - name: Build OCCT static libs
        if: steps.cache-occt.outputs.cache-hit != 'true'
        run: bash scripts/build-wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Bump package version
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMITS=$(git log $RANGE --pretty=%s)
          echo "Commits since ${LAST_TAG:-repo start}:"
          echo "$COMMITS"

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi
          echo "Detected bump type: $BUMP"

          npm version "$BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")

          # Guard against re-running the workflow with no new commits, or a
          # bump type that lands on a version already on the registry.
          while npm view "${PKG_NAME}@${NEW_VERSION}" version >/dev/null 2>&1; do
            echo "Version ${NEW_VERSION} is already published, bumping patch..."
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
          done

          echo "    Publishing version: ${NEW_VERSION}"
          echo "version=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          git add package.json package-lock.json
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Run codegen
        run: npm run codegen

      - name: Build WASM bindings
        run: bash scripts/build-bindings.sh

      - name: Build TypeScript package
        run: npm run build:ts && npm run copy-wasm

      - name: Run tests
        run: npm test

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate full changelog
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          {
            echo "# ${VERSION}"
            echo
            echo "## Full Changelog"
            echo
            git log --reverse --date=short --pretty=format:'- %ad %h %s (@%an)'
            echo
          } > RELEASE_CHANGELOG.md

      - name: Create dist tarball for Vercel deployment
        run: tar czf dist.tar.gz dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          files: dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
